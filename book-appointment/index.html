<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book an Appointment — Paradise Dental</title>
  <link rel="icon" type="image/png" href="../assets/images/usa_logo.png">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
      color: #0f172a;
    }
    h1, h2, h3, .heading { font-family: 'Plus Jakarta Sans', sans-serif; }
    /* The Jarvis booking widget is a single-page expanding flow (patient type ->
       service -> calendar all appear inline) and is cross-origin, so it can't
       auto-size. We give it enough fixed height to fit its fullest state, which
       lets the page scroll naturally instead of trapping a nested scrollbar. */
    .booking-frame { border: 0; width: 100%; height: 1700px; display: block; }
    @media (max-width: 767px) {
      /* On narrow screens the service tiles and time slots stack vertically,
         so the fully expanded flow is considerably taller. */
      .booking-frame { height: 2700px; }
    }
  </style>
</head>
<body>
  <header class="border-b border-gray-100">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="../index.html" class="text-xl font-bold heading" style="color:#15803d;">Paradise Dental</a>
      <a href="../index.html" class="text-sm text-gray-500 hover:text-green-700">&larr; Back to Home</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl md:text-3xl font-bold heading">Book an Appointment</h1>
      <p class="text-gray-500 mt-2">Schedule your visit online in just a few steps.</p>
    </div>
    <iframe
      class="booking-frame"
      src="https://schedule.jarvisanalytics.com/frame?eoid=8324&elid=8000000000414"
      title="Book an appointment with Paradise Dental"
      loading="lazy"></iframe>
  </main>
</body>
</html>
